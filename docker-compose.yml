services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docutok-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docutok-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # Ollama service - commented out, using native Ollama for GPU acceleration on Mac
  # To use Docker Ollama instead, uncomment and add 'ollama: condition: service_healthy' to backend depends_on
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: docutok-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docutok-backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKEND_PORT: ${BACKEND_PORT}
      CORS_ORIGINS: http://localhost:${VITE_PORT},http://frontend:${VITE_PORT}
      DEBUG: ${DEBUG}
      # Use native Ollama on host for GPU acceleration (Mac Metal)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Google Cloud Speech APIs
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/dokutok-e20fc8113919.json
      TTS_VOICE: ${TTS_VOICE:-en-US-Neural2-F}
      # Redis and Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./credentials:/app/credentials:ro
      - ./dbbackups:/app/dbbackups
      - ./scripts:/app/scripts:ro
    command: sh -c "uv run python -m alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT} --reload"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docutok-celery
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: uv run celery -A app.core.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docutok-frontend
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT}
      VITE_PORT: ${VITE_PORT}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Exclude node_modules from bind mount
    command: npm run dev -- --host 0.0.0.0 --port ${VITE_PORT}

volumes:
  postgres_data:
  redis_data:
  # ollama_data:  # Commented out - using native Ollama
