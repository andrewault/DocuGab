[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic>=1.18.1",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "boto3>=1.34.0",
    "celery[redis]>=5.3.0",
    "email-validator>=2.0.0",
    "fastapi>=0.128.0",
    "google-cloud-speech>=2.0.0",
    "google-cloud-texttospeech>=2.0.0",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-aws>=0.1.0",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.6.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "redis[hiredis]>=5.0.0",
    "greenlet>=3.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.40.0",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
]
