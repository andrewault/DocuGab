apiVersion: apps/v1
kind: Deployment
metadata:
  name: docutok-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docutok-ollama
  template:
    metadata:
      labels:
        app: docutok-ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
      volumes:
      - name: ollama-data
        emptyDir: {} # For production, use a PersistentVolumeClaim
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  selector:
    app: docutok-ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
  type: ClusterIP
