apiVersion: apps/v1
kind: Deployment
metadata:
  name: docutok-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docutok-backend
  template:
    metadata:
      labels:
        app: docutok-backend
    spec:
      initContainers:
      - name: migrate
        image: 932380677908.dkr.ecr.us-west-2.amazonaws.com/docutok-backend:v48
        command: ["uv", "run", "python", "-m", "alembic", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: docutok-config
        - secretRef:
            name: docutok-secrets
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docutok-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+asyncpg://docutok:$(POSTGRES_PASSWORD)@docutok-db-postgresql.default.svc.cluster.local:5432/docutok"
      containers:
      - name: backend
        image: 932380677908.dkr.ecr.us-west-2.amazonaws.com/docutok-backend:v48
        command: ["/bin/bash", "-c", "apt-get update && apt-get install -y ffmpeg && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: docutok-config
        - secretRef:
            name: docutok-secrets
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docutok-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+asyncpg://docutok:$(POSTGRES_PASSWORD)@docutok-db-postgresql.default.svc.cluster.local:5432/docutok"
        - name: POSTGRES_HOST
          value: "docutok-db-postgresql.default.svc.cluster.local"
        - name: POSTGRES_USER
          value: "docutok"
        - name: POSTGRES_DB
          value: "docutok"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docutok-redis
              key: redis-password
        # Add necessary mounts for uploads if not using S3
        volumeMounts:
        - name: app-core-config
          mountPath: /app/app/core/config.py
          subPath: config.py
      volumes:
      - name: app-core-config
        configMap:
          name: docutok-app-core-config

